name: Validate skills and scripts

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skills-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install validation and test dependencies
        run: >-
          python -m pip install
          'PyYAML==6.0.3' 'ruff==0.16.10' 'pyright==1.1.414'
          sympy numpy scipy networkx statsmodels matplotlib z3-solver pyscipopt
          nbformat nbclient ipykernel

      - name: Lint Python scripts
        run: ruff check

      - name: Type-check Python scripts
        run: pyright --warnings

      - name: Check syntax of all tracked Python files
        shell: python
        run: |
          import subprocess
          from pathlib import Path

          paths = subprocess.check_output(
              ["git", "ls-files", "-z", "--", "*.py"]
          ).decode("utf-8").split("\0")
          for path in filter(None, paths):
              compile(Path(path).read_bytes(), path, "exec")

      - name: Validate skill metadata, links, and release packaging
        env:
          SKILL_ARCHIVE: ${{ runner.temp }}/math-skills.zip
        run: python -B scripts/release_skills.py --output "$SKILL_ARCHIVE"

      - name: Run helper regression tests
        env:
          PYTHONIOENCODING: utf-8
        run: python -B -X utf8=0 -m unittest discover -s tests -v
