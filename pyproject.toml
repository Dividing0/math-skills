[project]
name = "math-skills"
version = "0.2.0"
description = "Mathematical skills to work with ChatGPT"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Yehor Smoliakov", email = "yehors@ukr.net" }
]
requires-python = ">=3.14"
dependencies = [
    "pyright>=1.1.414",
    "ruff>=0.16.10",
]

[tool.pyright]
include = ["**/*.py"]
exclude = ["**/.venv", "**/venv", "**/__pycache__", "build", "dist"]
pythonVersion = "3.14"
typeCheckingMode = "standard"
# Skills provision their own optional runtimes (including SageMath and FEniCS).
# Check our code without requiring every scientific library in the tooling env.
reportMissingImports = false
reportMissingModuleSource = false
# Use published stubs/annotations rather than inferring APIs from untyped libraries.
useLibraryCodeForTypes = false
